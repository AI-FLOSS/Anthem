name: AI review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    env:
      HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
    steps:
      # Pull requests from forks get no secrets, so the review is skipped rather than failing.
      - name: Skip without an API key
        if: env.HAS_KEY != 'true'
        run: echo "ANTHROPIC_API_KEY is not available; skipping AI review."

      - uses: actions/checkout@v4
        if: env.HAS_KEY == 'true'
        with:
          fetch-depth: 1

      - name: Review with Claude
        if: env.HAS_KEY == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request against the rules in AGENTS.md. Focus on:
            - Bugs, and anything that breaks DESIGN-SPEC or the rules in AGENTS.md.
            - Filesystem writes that bypass assertWritable().
            - Missing or weak tests for changed behaviour.

            Use inline comments for specific problems and one short summary comment.
            Say plainly when you are unsure. Do not approve or request changes.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
